# Configuração do omp para o projeto EnochDB.
#
# Escopo: settings nativos de projeto não sobem para diretórios ancestrais, então
# este arquivo só tem efeito quando o cwd é este diretório (ou um descendente).
# O roster de papéis (.aleph/agents/) é compartilhado e não carrega modelo no
# contrato; a escolha de modelo por ambiente mora aqui.

modelRoles:
  # Sessão principal: Opus. O ICM, o Jev e a orquestração chamam os papéis por `task`.
  default: anthropic/claude-opus-5-5
  # Topo consultado (planejamento arquitetural): Opus.
  plan: anthropic/claude-opus-5-5
  # Advisor: Opus.
  advisor: anthropic/claude-opus-5-5:high
  # Judge: Jev (TypeSafe System One), nativo. Alimenta o `judge()` do eval e os
  # gates de julgamento do ICM (docs/agents/jev.md). Sem fallback para chat
  # model: se a chave do typesafe falhar, o gate devolve `bloqueado`.
  # Pinar `typesafe/jev-1.13.0` só depois de calibrar qualquer limiar; o
  # catálogo hoje só expõe `jev-latest`.
  judge: typesafe/jev-latest

advisor:
  enabled: true

# Roteamento por papel. `task.agentModelOverrides` tem precedência sobre o
# frontmatter do papel. O roster hoje fixa `model: deepseek` em todos os 17
# arquivos, então a herança do padrão não acontece: cada papel precisa do
# override explícito abaixo.
task:
  agentModelOverrides:
    # Topo — decidem, revisam decisão e fatiam o trabalho (Opus).
    00-orchestration-icm: anthropic/claude-opus-5-5
    01-orchestration-reviewer: anthropic/claude-opus-5-5
    20-architecture-keeper: anthropic/claude-opus-5-5
    21-architecture-data: anthropic/claude-opus-5-5
    30-ticketing-slicer: anthropic/claude-opus-5-5
    # Camada intermediária — leitura, estado e fechamento (Sonnet).
    02-orchestration-status: anthropic/claude-sonnet-5-5
    10-discovery-backlog: anthropic/claude-sonnet-5-5
    11-discovery-rubberduck: anthropic/claude-sonnet-5-5
    52-integration-poc: anthropic/claude-sonnet-5-5
    53-doubt-explorer: anthropic/claude-sonnet-5-5
    54-code-explorer: anthropic/claude-sonnet-5-5
    60-sprint-review: anthropic/claude-sonnet-5-5
    # Workers — faixa de implementação (DeepSeek v4.1 flash do opencode).
    40-implementation-loop: opencode-go/deepseek-v4.1-flash
    41-implementation-captain: opencode-go/deepseek-v4.1-flash
    42-implementation-backend: opencode-go/deepseek-v4.1-flash
    43-implementation-frontend: opencode-go/deepseek-v4.1-flash
    44-implementation-integration: opencode-go/deepseek-v4.1-flash
    45-implementation-troubleshooter: opencode-go/deepseek-v4.1-flash
