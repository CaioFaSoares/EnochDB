# Configuração do omp para o projeto EnochDB.
#
# Escopo: settings nativos de projeto não sobem para diretórios ancestrais, então
# este arquivo só tem efeito quando o cwd é este diretório (ou um descendente).
# O roster de papéis (.aleph/agents/) é compartilhado e não carrega modelo no
# contrato; a escolha de modelo por ambiente mora aqui.
#
# Divisão de trabalho:
#   Opus     — só a sessão principal: conversa e planejamento com o dono. Não é
#              usado em subagente.
#   Sonnet   — advisor do DeepSeek e revisor: julga, revisa, fatia e integra.
#   DeepSeek — a maioria das tarefas: geração de código, execução mecânica,
#              varredura e leitura. É barato; o Sonnet cobre o que ele erra.

modelRoles:
  # Sessão principal e planejamento: Opus.
  default: anthropic/claude-opus-5-5
  plan: anthropic/claude-opus-5-5
  # Advisor: Sonnet, consultado pelo DeepSeek antes de decisões ou ao travar.
  advisor: anthropic/claude-sonnet-5-5:high
  # Subagente genérico (`task` sem papel do roster): DeepSeek.
  task: opencode-go/deepseek-v4.1-flash
  # Judge: Jev (TypeSafe System One), nativo. Alimenta o `judge()` do eval e os
  # gates de julgamento do ICM (docs/agents/jev.md). Sem fallback para chat
  # model: se a chave do typesafe falhar, o gate devolve `bloqueado`.
  # Pinar `typesafe/jev-1.13.0` só depois de calibrar qualquer limiar; o
  # catálogo hoje só expõe `jev-latest`.
  judge: typesafe/jev-latest

advisor:
  enabled: true

# Roteamento por papel. `task.agentModelOverrides` tem precedência sobre o
# frontmatter do papel. O roster fixa `model: deepseek` nos arquivos, então a
# herança do padrão não acontece: cada um dos 18 papéis precisa do override
# explícito abaixo.
task:
  agentModelOverrides:
    # Sonnet — orquestra, revisa decisão, revisa entrega e fatia o trabalho.
    00-orchestration-icm: anthropic/claude-sonnet-5-5
    01-orchestration-reviewer: anthropic/claude-sonnet-5-5
    20-architecture-keeper: anthropic/claude-sonnet-5-5
    21-architecture-data: anthropic/claude-sonnet-5-5
    30-ticketing-slicer: anthropic/claude-sonnet-5-5
    60-sprint-review: anthropic/claude-sonnet-5-5
    # DeepSeek v4.1 flash (opencode) — leitura, varredura e experimento.
    02-orchestration-status: opencode-go/deepseek-v4.1-flash
    10-discovery-backlog: opencode-go/deepseek-v4.1-flash
    11-discovery-rubberduck: opencode-go/deepseek-v4.1-flash
    52-integration-poc: opencode-go/deepseek-v4.1-flash
    53-doubt-explorer: opencode-go/deepseek-v4.1-flash
    54-code-explorer: opencode-go/deepseek-v4.1-flash
    # DeepSeek v4.1 flash (opencode) — faixa de implementação.
    40-implementation-loop: opencode-go/deepseek-v4.1-flash
    41-implementation-captain: opencode-go/deepseek-v4.1-flash
    42-implementation-backend: opencode-go/deepseek-v4.1-flash
    43-implementation-frontend: opencode-go/deepseek-v4.1-flash
    44-implementation-integration: opencode-go/deepseek-v4.1-flash
    45-implementation-troubleshooter: opencode-go/deepseek-v4.1-flash
